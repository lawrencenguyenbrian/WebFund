<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../PNG/icon.png">
<title>Đăng nhập / Đăng ký — WebFund</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/auth.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body data-bs-theme="dark">

  <div class="auth-bg min-vh-100 d-flex align-items-center justify-content-center py-4 px-3">
    <div class="w-100" style="max-width:440px">

      <div class="border rounded-top px-3 py-2 d-flex align-items-center gap-2 auth-terminal" style="border-bottom:0">
        <span class="rounded-circle d-inline-block" style="width:10px;height:10px;background:#ff5f56"></span>
        <span class="rounded-circle d-inline-block" style="width:10px;height:10px;background:#ffbd2e"></span>
        <span class="rounded-circle d-inline-block" style="width:10px;height:10px;background:#27c93f"></span>
        <small class="text-muted ms-2 font-monospace">webfund — auth</small>
      </div>

      <div class="card border-0 auth-card shadow" style="border-radius:0 0 12px 12px">
        <div class="card-body p-4 p-md-5">

          <a href="main.html" class="fw-bold text-decoration-none fs-5 d-block text-center mb-1">&lt;<span class="text-primary">WebFund</span>/&gt;</a>
          <p class="text-muted small text-center mb-4">Nền tảng gọi vốn cho sản phẩm số</p>

          <ul class="nav nav-pills nav-justified mb-4 auth-tabs gap-2" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="loginTab" data-bs-toggle="pill" data-bs-target="#loginPane" type="button">Đăng nhập</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="registerTab" data-bs-toggle="pill" data-bs-target="#registerPane" type="button">Đăng ký</button>
            </li>
          </ul>

          <div class="tab-content">
            <div class="tab-pane fade show active" id="loginPane">
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label small fw-medium">Email</label>
                  <input type="email" class="form-control" id="loginEmail" placeholder="your@email.com" required autofocus>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-medium">Mật khẩu</label>
                  <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                </div>
                <p class="text-danger small mb-2" id="loginError" hidden></p>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">Đăng nhập</button>
              </form>
              <div class="position-relative my-3">
                <hr class="text-muted">
                <span class="position-absolute top-50 start-50 translate-middle px-2 small text-muted" style="background:inherit">hoặc</span>
              </div>
              <button class="btn btn-light border w-100 py-2 fw-medium d-flex align-items-center justify-content-center gap-2" id="googleLoginBtn">
                <span style="font-weight:700;color:#4285f4">G</span>
                Đăng nhập với Google
              </button>
            </div>

            <div class="tab-pane fade" id="registerPane">
              <form id="registerForm">
                <div class="mb-3">
                  <label class="form-label small fw-medium">Họ tên</label>
                  <input type="text" class="form-control" id="registerName" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-medium">Email</label>
                  <input type="email" class="form-control" id="registerEmail" placeholder="your@email.com" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-medium">Mật khẩu</label>
                  <input type="password" class="form-control" id="registerPassword" placeholder="••••••••" minlength="6" required>
                  <div class="form-text">Tối thiểu 6 ký tự</div>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-medium mb-2">Bạn muốn sử dụng WebFund với tư cách nào?</label>
                  <div class="d-flex gap-2">
                    <label class="role-select-card flex-fill" id="regRoleFounder">
                      <input type="radio" name="registerRole" value="founder" class="d-none" checked>
                      <div class="role-select-icon"><i class="bi bi-rocket-takeoff"></i></div>
                      <div class="role-select-title">Founder</div>
                      <div class="role-select-desc">Đăng dự án, gọi vốn</div>
                    </label>
                    <label class="role-select-card flex-fill" id="regRoleInvestor">
                      <input type="radio" name="registerRole" value="investor" class="d-none">
                      <div class="role-select-icon"><i class="bi bi-cash-coin"></i></div>
                      <div class="role-select-title">Nhà đầu tư</div>
                      <div class="role-select-desc">Góp vốn, đầu tư</div>
                    </label>
                  </div>
                </div>
                <p class="text-danger small mb-2" id="registerError" hidden></p>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">Đăng ký</button>
              </form>
              <div class="position-relative my-3">
                <hr class="text-muted">
                <span class="position-absolute top-50 start-50 translate-middle px-2 small text-muted" style="background:inherit">hoặc</span>
              </div>
              <button class="btn btn-light border w-100 py-2 fw-medium d-flex align-items-center justify-content-center gap-2" id="googleRegisterBtn">
                <span style="font-weight:700;color:#4285f4">G</span>
                Đăng ký với Google
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/firebase-config.js"></script>
  <script src="../JS/auth.js"></script>
</body>
</html>
