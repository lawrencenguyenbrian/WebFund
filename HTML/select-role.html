<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chọn vai trò — WebFund</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/select-role.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body data-bs-theme="dark">

  <div class="role-bg min-vh-100 d-flex align-items-center justify-content-center py-4 px-3">
    <div class="w-100" style="max-width:520px">

      <div class="border rounded-top px-3 py-2 d-flex align-items-center gap-2 role-terminal" style="border-bottom:0">
        <span class="rounded-circle d-inline-block" style="width:10px;height:10px;background:#ff5f56"></span>
        <span class="rounded-circle d-inline-block" style="width:10px;height:10px;background:#ffbd2e"></span>
        <span class="rounded-circle d-inline-block" style="width:10px;height:10px;background:#27c93f"></span>
        <small class="text-muted ms-2 font-monospace">webfund — select role</small>
      </div>

      <div class="card border-0 role-card shadow" style="border-radius:0 0 12px 12px">
        <div class="card-body p-4 p-md-5 text-center">

          <a href="main.html" class="fw-bold text-decoration-none fs-5 d-block text-center mb-1">&lt;<span class="text-primary">WebFund</span>/&gt;</a>
          <p class="text-muted small mb-4">Bạn muốn sử dụng WebFund với tư cách nào?</p>

          <div class="d-flex gap-3 mb-4">
            <button class="role-option" data-role="founder" id="roleFounder">
              <div class="role-icon"><i class="bi bi-rocket-takeoff"></i></div>
              <div class="role-title">Founder</div>
              <div class="role-desc">Đăng dự án, gọi vốn, quản lý tiến độ</div>
            </button>
            <button class="role-option" data-role="investor" id="roleInvestor">
              <div class="role-icon"><i class="bi bi-cash-coin"></i></div>
              <div class="role-title">Nhà đầu tư</div>
              <div class="role-desc">Cam kết góp vốn, theo dõi danh mục</div>
            </button>
          </div>

          <p class="text-danger small mb-2" id="roleError" hidden></p>

          <p class="text-muted" style="font-size:.75rem">Bạn có thể thay đổi vai trò sau trong phần cài đặt.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/firebase-config.js"></script>
  <script src="../JS/select-role.js"></script>
</body>
</html>
